<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Library</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#595a5a,#424242,#949494);
      color:white;
      min-height:100vh;
      padding:40px 20px;
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
    }

    .title{
      text-align:center;
      margin-bottom:50px;
    }

    .title h1{
      font-size:clamp(2rem,5vw,4rem);
      margin-bottom:10px;
    }

    .title p{
      color:#cbd5e1;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:25px;
    }

    .card{
      background:rgba(223, 223, 223, 0.05);
      border:1px solid rgba(139, 139, 139, 0.08);
      backdrop-filter:blur(15px);
      border-radius:25px;
      padding:25px;
      transition:0.3s ease;
      box-shadow:0 10px 25px rgba(177, 177, 177, 0.3);
    }

    .card:hover{
      transform:translateY(-6px);
    }

    .card h2{
      margin-bottom:10px;
      font-size:1.5rem;
    }

    .card p{
      color:#cbd5e1;
      margin-bottom:20px;
      line-height:1.7;
    }

    .code-box{
      position:relative;
      border-radius:15px;
      padding:15px;
      overflow:auto;
    }

    pre{
      white-space:pre-wrap;
      word-wrap:break-word;
      color:#e3f0ff;
      font-size:0.9rem;
    }

    .copy-btn{
      margin-top:15px;
      width:85%;
      border:none;
      padding:40px;
      border-radius:12px;
      cursor:pointer;
      color:white;
      font-weight:600;
      background:linear-gradient(to right,#bbbbbb,#adadad);
      transition:0.3s;
    }

    .copy-btn:hover{
      transform:scale(1.02);
    }

    .back{
      display:inline-block;
      margin-bottom:40px;
      text-decoration:none;
      color:white;
      padding:12px 25px;
      border-radius:12px;
      background:rgba(197, 197, 197, 0.08);
      transition:0.3s;
    }

    .back:hover{
      background:rgba(255,255,255,0.15);
    }

    @media(max-width:600px){
      body{
        padding:20px 15px;
      }

      .card{
        padding:20px;
      }
    }
  </style>
</head>
<body>

    <div class="title">
      <h1>Code Library</h1>
      <p></p>
    </div>

    <div class="cards">

      <div class="card">
        <h2>C++ Terminal</h2>

        <p>
          My terminal in c++
        </p>

        <a href="code1.html" class="copy-btn">

        <a href="code2.html">
          <button class="copy-btn" style="width: 100%;">

          </button>
        </a>
      </div>

    </div>

  </div>

</body>
</html>
