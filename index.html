
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bony-codes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#595a5a,#424242,#949494);
      color:white;
      overflow-x:hidden;
    }

    .background{
      position:fixed;
      inset:0;
      z-index:-1;
      overflow:hidden;
    }

    .circle{
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      opacity:0.4;
      animation:float 10s infinite ease-in-out;
    }

    .circle:nth-child(1){
      width:300px;
      height:300px;
      background:#000000;
      top:-50px;
      left:-50px;
    }

    .circle:nth-child(2){
      width:250px;
      height:250px;
      background:#000000;
      bottom:-50px;
      right:-50px;
      animation-delay:2s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-25px);
      }
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:30px;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:80px;
    }

/* SOCIALS */

.socials{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
}

ul{
  list-style:none;
}

.example-2{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:0;
}

.example-2 .icon-content{
  position:relative;
}

.example-2 .icon-content .tooltip{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  opacity:0;
  visibility:hidden;
  font-size:14px;
  transition:all 0.3s ease;
  white-space:nowrap;
}

.example-2 .icon-content:hover .tooltip{
  opacity:1;
  visibility:visible;
  top:-45px;
}

.example-2 .icon-content a{
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:55px;
  height:55px;
  border-radius:50%;
  color:#4d4d4d;
  background:rgba(255,255,255,0.95);
  transition:all 0.3s ease-in-out;
  text-decoration:none;
}

.example-2 .icon-content a:hover{
  transform:translateY(-5px) scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.example-2 .icon-content a svg{
  position:relative;
  z-index:1;
  width:28px;
  height:28px;
}

.example-2 .icon-content a:hover{
  color:white;
}

.example-2 .icon-content a .filled{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:0;
  transition:all 0.3s ease-in-out;
}

.example-2 .icon-content a:hover .filled{
  height:100%;
}

.example-2 .icon-content a[data-social="linkedin"] .filled,
.example-2 .icon-content a[data-social="linkedin"] ~ .tooltip{
  background-color:#0274b3;
}

.example-2 .icon-content a[data-social="github"] .filled,
.example-2 .icon-content a[data-social="github"] ~ .tooltip{
  background-color:#24262a;
}

.example-2 .icon-content a[data-social="instagram"] .filled,
.example-2 .icon-content a[data-social="instagram"] ~ .tooltip{
  background:linear-gradient(
    45deg,
    #405de6,
    #5b51db,
    #b33ab4,
    #c135b4,
    #e1306c,
    #fd1f1f
  );
}

.example-2 .icon-content a[data-social="youtube"] .filled,
.example-2 .icon-content a[data-social="youtube"] ~ .tooltip{
  background-color:#ff0000;
}

@media(max-width:600px){
  .socials{
    bottom:20px;
  }

  .example-2{
    gap:10px;
  }

  .example-2 .icon-content a{
    width:50px;
    height:50px;
  }
}

    .logo{
      font-size:1.8rem;
      font-weight:700;
      background:linear-gradient(to right,#f5f5f5,#8b8b8b);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero{
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      min-height:70vh;
    }

    .hero-content{
      max-width:700px;
      padding:40px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);
      border-radius:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .hero h1{
      font-size:clamp(2.5rem,6vw,5rem);
      margin-bottom:20px;
      line-height:1.1;
    }

    .hero p{
      color:#cbd5e1;
      font-size:1.1rem;
      line-height:1.8;
      margin-bottom:35px;
    }

    .btn{
      display:inline-block;
      padding:15px 35px;
      border-radius:15px;
      text-decoration:none;
      color:white;
      font-weight:600;
      background:linear-gradient(to right,#a7a7a7,#8b8b8b);
      transition:0.3s ease;
      box-shadow:0 5px 20px rgba(139, 139, 139, 0.4);
    }

    .btn:hover{
      transform:translateY(-4px) scale(1.03);
      box-shadow:0 10px 25px rgba(121, 121, 121, 0.5);
    }

    @media(max-width:768px){
      .container{
        padding:20px;
      }

      nav{
        margin-bottom:50px;
      }

      .hero-content{
        padding:30px 20px;
      }

      .hero p{
        font-size:1rem;
      }
    }
  </style>
</head>
<body>

</div>

  </div>

  <div class="container">

      <div class="hero-content">

</body>
</html>
